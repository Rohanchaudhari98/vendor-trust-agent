[project]
name = "vendor-trust-agent"
version = "0.1.0"
description = "Tavily-powered, cited, pre-payment vendor risk check for AP invoice review workflows"
requires-python = ">=3.11"
dependencies = [
    "tavily-python>=0.5.0",
    "langchain-core>=0.3.0",
    "langchain-nebius>=0.1.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "langfuse>=2.50.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sqlmodel>=0.0.21",
    "pdfplumber>=0.11.10",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv]
package = false
